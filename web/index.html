<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Карго Китай - личный кабинет клиента">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Карго Китай">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Карго Китай</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #flutter-splash {
      position: fixed;
      inset: 0;
      background: #F2F2F7;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #flutter-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 56px;
      height: 56px;
      position: relative;
    }
    .spinner-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3.5px solid transparent;
      animation: spin 1.1s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .spinner-ring:nth-child(1) {
      border-top-color: #FF5E04;
      animation-duration: 1.1s;
    }
    .spinner-ring:nth-child(2) {
      inset: 8px;
      border-top-color: #FF8800;
      animation-duration: 0.85s;
      animation-direction: reverse;
    }
    .spinner-ring:nth-child(3) {
      inset: 16px;
      border-top-color: #FE3301;
      animation-duration: 1.4s;
    }
    #flutter-startup-error {
      max-width: 420px;
      padding: 24px;
      text-align: center;
      font: 16px/1.5 Arial, sans-serif;
      color: #202124;
    }
    #flutter-startup-error button {
      margin-top: 12px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #FF5E04;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="flutter-splash">
    <div id="flutter-startup-spinner" class="spinner">
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
    </div>
    <div id="flutter-startup-error" role="alert" hidden>
      <p>Не удалось загрузить приложение. Проверьте соединение и повторите.<br>应用未能加载，请检查网络后重试。</p>
      <button id="flutter-startup-retry" type="button">Повторить / 重试</button>
    </div>
  </div>
  <script id="web-startup-guard">
    (function() {
      var finished = false;
      function fail() {
        if (finished) return;
        var spinner = document.getElementById('flutter-startup-spinner');
        var error = document.getElementById('flutter-startup-error');
        if (spinner) spinner.hidden = true;
        if (error) error.hidden = false;
      }
      var deadline = window.setTimeout(fail, 45000);
      function complete() {
        if (finished) return;
        finished = true;
        window.clearTimeout(deadline);
        window.removeEventListener('error', fail, true);
        window.removeEventListener('unhandledrejection', fail);
        var splash = document.getElementById('flutter-splash');
        if (splash) {
          splash.classList.add('hidden');
          window.setTimeout(function() { splash.remove(); }, 380);
        }
      }
      // Resource errors (main/bootstrap/renderer) and rejected engine startup
      // must not leave an endless HTML spinner. Never replace a rendered app.
      window.addEventListener('error', fail, true);
      window.addEventListener('unhandledrejection', fail);
      window.addEventListener('flutter-first-frame', complete);
      document.getElementById('flutter-startup-retry').addEventListener('click', function() {
        window.location.reload();
      });
      window.twoaWebStartup = { fail: fail };
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      var logServiceWorkerWarning = function(message, error) {
        console.warn(message, error);
      };
      var isLocalFlutterRun =
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1' ||
        location.hostname === '[::1]';

      if (isLocalFlutterRun) {
        navigator.serviceWorker.getRegistrations()
          .then(function(registrations) {
            registrations.forEach(function(reg) {
              reg.unregister().catch(function(error) {
                logServiceWorkerWarning('Service worker unregister failed:', error);
              });
            });
          })
          .catch(function(error) {
            logServiceWorkerWarning('Service worker registration lookup failed:', error);
          });
      } else {

        // Force Flutter service worker to check for updates on every load
        navigator.serviceWorker.getRegistrations()
          .then(function(registrations) {
            registrations.forEach(function(reg) {
              reg.update().catch(function(error) {
                logServiceWorkerWarning('Service worker update failed:', error);
              });
            });
          })
          .catch(function(error) {
            logServiceWorkerWarning('Service worker registration lookup failed:', error);
          });

        // Register Firebase Messaging Service Worker for push notifications
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then((registration) => {
            console.log('Firebase Messaging SW registered:', registration.scope);
            // Force update check
            return registration.update().catch((error) => {
              logServiceWorkerWarning('Firebase Messaging SW update failed:', error);
            });
          })
          .catch((error) => {
            console.error('Firebase Messaging SW registration failed:', error);
          });

        // When a new SW activates, reload the page to get fresh assets.
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          window.location.reload();
        });
      }
    }
  </script>
  <script src="bundle.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
