server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Flutter web может запросить license asset как /NOTICES. Без отдельного
  # правила nginx отдаёт index.html fallback, что превращается в шумную
  # FlutterError "Unable to load asset: NOTICES".
  location = /NOTICES {
    default_type text/plain;
    try_files /assets/NOTICES =404;
  }

  location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
