server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Flutter web entrypoints keep stable filenames between releases, so they
  # must never inherit the long-lived immutable rule used for static assets.
  location ~* ^/(?:flutter_bootstrap\.js|main\.dart\.js)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Flutter web может запросить license asset как /NOTICES. Без отдельного
  # правила nginx отдаёт index.html fallback, что превращается в шумную
  # FlutterError "Unable to load asset: NOTICES".
  location = /NOTICES {
    default_type text/plain;
    try_files /assets/NOTICES =404;
  }

  # Keep partner invite links on cabinet.{agent-domain} while the backend
  # validates the signed token and serves the native-app/web handoff page.
  location ^~ /client-partner/invite/ {
    proxy_pass https://prod-api.cp.2a-logistic.com;
    proxy_ssl_server_name on;
    proxy_set_header Host prod-api.cp.2a-logistic.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
