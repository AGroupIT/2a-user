name: Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sentry_dsn:
        description: 'Sentry DSN for error tracking'
        required: false
        type: string

jobs:
  deploy:
    name: Build and Deploy Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0-0.3.pre'
          channel: 'beta'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Resolve build metadata
        id: metadata
        run: |
          FULL_VERSION="$(sed -n 's/^version: //p' pubspec.yaml)"
          BUILD_NUMBER="${FULL_VERSION##*+}"
          SOURCE_REVISION="${GITHUB_SHA:0:12}"
          echo "release=com.twoalogistic.user@$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "dist=$BUILD_NUMBER-$SOURCE_REVISION" >> "$GITHUB_OUTPUT"

      - name: Build web
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || inputs.sentry_dsn }}
          SENTRY_RELEASE: ${{ steps.metadata.outputs.release }}
          SENTRY_DIST: ${{ steps.metadata.outputs.dist }}
        run: |
          SENTRY_ARGS=(
            --dart-define=SENTRY_ENVIRONMENT=production
            --dart-define=SENTRY_RELEASE="$SENTRY_RELEASE"
            --dart-define=SENTRY_DIST="$SENTRY_DIST"
          )
          if [ -n "$SENTRY_DSN" ]; then
            SENTRY_ARGS+=(--dart-define=SENTRY_DSN="$SENTRY_DSN")
          fi
          flutter build web --release --pwa-strategy none --source-maps "${SENTRY_ARGS[@]}"

      - name: Upload source maps from the deployed build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: https://sentry.cp.2a-logistic.com
          SENTRY_PROJECT: 2a-user
          SENTRY_ORG: sentry
          SENTRY_RELEASE: ${{ steps.metadata.outputs.release }}
          SENTRY_DIST: ${{ steps.metadata.outputs.dist }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "WARNING: SENTRY_AUTH_TOKEN is missing; source maps were not uploaded."
            exit 0
          fi
          dart run sentry_dart_plugin \
            --sentry-define=url="$SENTRY_URL" \
            --sentry-define=project="$SENTRY_PROJECT" \
            --sentry-define=org="$SENTRY_ORG" \
            --sentry-define=release="$SENTRY_RELEASE" \
            --sentry-define=dist="$SENTRY_DIST" \
            --sentry-define=commits=false

      - name: Copy firebase-messaging-sw.js
        run: |
          if [ -f web/firebase-messaging-sw.js ]; then
            cp web/firebase-messaging-sw.js build/web/
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

      - name: Deploy to FTP
        if: ${{ secrets.FTP_HOST != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: build/web/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/home/administrator_cabinetapp/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deployment summary
        run: |
          echo "### Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** Successful ✓" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.FTP_HOST }}" ]; then
            echo "- **FTP Deploy:** Completed ✓" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **FTP Deploy:** Skipped (no credentials)" >> $GITHUB_STEP_SUMMARY
          fi
